name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test -p codeskd

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: cargo build -p codeskd
      - run: node scripts/test-session-budget.mjs
      - run: node scripts/test-run-archive.mjs
      - run: node scripts/test-daemon-survival.mjs
      - run: node scripts/test-daemon-lifecycle.mjs
      - run: node scripts/test-gateway-origin.mjs
      - run: node scripts/test-worktrees.mjs
      - run: node scripts/test-discovery.mjs
      - run: node scripts/test-drafts.mjs
      - run: node scripts/test-host-bootstrap-retry.mjs
      - run: node scripts/test-mappers.mjs
