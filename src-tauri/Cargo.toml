[package]
name = "codesk-desktop"
version = "0.2.0"
edition = "2024"
description = "Codesk desktop control plane for coding agents"
license = "MIT"
repository = "https://github.com/dat-lequoc/codesk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
